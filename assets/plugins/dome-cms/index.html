<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dome CMS</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color-scheme:light dark;background:#fafafa;color:#171717}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#fafafa;color:#171717}.shell{max-width:1180px;margin:auto;padding:32px}.top{display:flex;align-items:flex-start;gap:16px;margin-bottom:28px}.top h1{font-size:28px;letter-spacing:-.04em;margin:0}.top p{color:#737373;margin:6px 0 0}.actions{margin-left:auto;display:flex;gap:8px}button{appearance:none;border:1px solid #d4d4d4;border-radius:9px;background:#fff;color:#171717;padding:9px 13px;font:inherit;font-weight:600;cursor:pointer}button.primary{background:#171717;color:#fff;border-color:#171717}button:disabled{opacity:.45;cursor:not-allowed}.notice{border:1px solid #e5e5e5;background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:18px;color:#525252;font-size:14px}.notice.error{border-color:#fca5a5;color:#b91c1c}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px}.card{border:1px solid #e5e5e5;border-radius:13px;background:#fff;padding:18px;display:flex;flex-direction:column;gap:14px;min-height:185px}.card h2{font-size:17px;margin:0;line-height:1.3}.meta{display:flex;gap:7px;flex-wrap:wrap}.pill{font-size:12px;border-radius:999px;background:#f5f5f5;padding:4px 8px;color:#525252}.pill.published{background:#dcfce7;color:#166534}.pill.changed{background:#fef3c7;color:#92400e}.card footer{display:flex;gap:8px;margin-top:auto}.empty{border:1px dashed #d4d4d4;border-radius:14px;padding:54px;text-align:center;color:#737373}.dialog{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px}.dialog[hidden]{display:none}.panel{width:min(520px,100%);background:#fff;border-radius:16px;padding:22px;box-shadow:0 24px 80px #0004}.panel h2{margin:0 0 18px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}.field label{font-size:13px;font-weight:600}.field input,.field select{border:1px solid #d4d4d4;border-radius:9px;background:#fafafa;color:#171717;padding:10px 11px;font:inherit}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}@media(prefers-color-scheme:dark){:root,body{background:#111;color:#f5f5f5}.card,.notice,.panel,button{background:#191919;color:#f5f5f5;border-color:#333}.top p,.empty{color:#a3a3a3}.pill{background:#292929;color:#d4d4d4}.field input,.field select{background:#111;color:#f5f5f5;border-color:#404040}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div><h1>Content</h1><p id="context">Loading your CMS workspace…</p></div><div class="actions"><button id="refresh">Refresh</button><button class="primary" id="new">New post</button></div></header>
    <div id="notice" class="notice" hidden></div><section id="list" class="grid"></section>
  </main>
  <div id="dialog" class="dialog" hidden><form id="form" class="panel"><h2>New Astro entry</h2><div class="field"><label for="title">Title</label><input id="title" required maxlength="240"></div><div class="field"><label for="collection">Collection</label><select id="collection" required><option value="blog">Blog</option><option value="manual">Manual</option></select></div><div class="field"><label for="language">Language</label><select id="language" required><option value="es">Español</option><option value="en">English</option></select></div><div class="field"><label for="description">Description</label><input id="description" required maxlength="500"></div><div class="field"><label for="date">Date</label><input id="date" type="date" required></div><div class="field"><label for="slug">Slug</label><input id="slug" required pattern="[a-z0-9]+(?:-[a-z0-9]+)*"></div><div class="dialog-actions"><button type="button" id="cancel">Cancel</button><button class="primary" type="submit">Create</button></div></form></div>
  <script>
    const list=document.querySelector('#list'),notice=document.querySelector('#notice'),dialog=document.querySelector('#dialog');
    const escapeHtml=value=>String(value??'').replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
    const slugify=value=>value.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,120);
    function show(message,error=false){notice.textContent=message;notice.className=`notice${error?' error':''}`;notice.hidden=!message}
    async function load(){show('');try{const [context,notes]=await Promise.all([DomePlugin.request('host.context'),DomePlugin.request('notes.list',{limit:100})]);document.querySelector('#context').textContent=`${context.vault.name} · ${context.destination?.repo||'GitHub destination not set'}`;render(notes)}catch(error){show(error.message,true)}}
    function render(notes){if(!notes.length){list.innerHTML='<div class="empty">No CMS entries yet. Create the first one.</div>';return}list.innerHTML=notes.map(note=>`<article class="card"><div><h2>${escapeHtml(note.title)}</h2><div class="meta"><span class="pill ${note.status}">${escapeHtml(note.status)}</span>${note.fields.collection&&note.fields.language?`<span class="pill">${escapeHtml(note.fields.collection)}/${escapeHtml(note.fields.language)}</span>`:''}${note.fields.date?`<span class="pill">${escapeHtml(note.fields.date)}</span>`:''}</div></div><p>${escapeHtml(note.fields.description||'No description')}</p><footer><button data-open="${note.id}">Open</button><button class="primary" data-publish="${note.id}" ${note.status==='published'?'disabled':''}>${note.status==='published'?'Published':'Publish'}</button></footer></article>`).join('');list.querySelectorAll('[data-open]').forEach(button=>button.onclick=()=>DomePlugin.request('notes.open',{id:button.dataset.open}));list.querySelectorAll('[data-publish]').forEach(button=>button.onclick=()=>publish(button.dataset.publish,button))}
    async function publish(resourceId,button){button.disabled=true;button.textContent='Preparing…';try{const proposal=await DomePlugin.request('publication.prepare',{resourceId});const result=await DomePlugin.request('publication.requestApproval',{id:proposal.id});show(result.status==='published'?`Published ${result.path}`:'Publication cancelled');await load()}catch(error){show(error.message,true);button.disabled=false;button.textContent='Publish'}}
    document.querySelector('#new').onclick=()=>{dialog.hidden=false;document.querySelector('#date').value=new Date().toISOString().slice(0,10);document.querySelector('#collection').value='blog';document.querySelector('#language').value='es';document.querySelector('#title').focus()};document.querySelector('#cancel').onclick=()=>dialog.hidden=true;document.querySelector('#refresh').onclick=load;document.querySelector('#title').oninput=event=>document.querySelector('#slug').value=slugify(event.target.value);
    document.querySelector('#form').onsubmit=async event=>{event.preventDefault();const title=document.querySelector('#title').value.trim();try{const note=await DomePlugin.request('notes.create',{title,body:`# ${title}\n\n`,fields:{collection:document.querySelector('#collection').value,language:document.querySelector('#language').value,date:document.querySelector('#date').value,description:document.querySelector('#description').value.trim(),slug:document.querySelector('#slug').value.trim(),tags:[],cover:''}});dialog.hidden=true;event.target.reset();await load();await DomePlugin.request('notes.open',{id:note.id})}catch(error){show(error.message,true)}};load();
  </script>
</body>
</html>
